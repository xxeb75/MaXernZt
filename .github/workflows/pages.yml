# Publication du site (vitrine + appli en ligne) sur GitHub Pages.
# Déclenchement : automatique à chaque push sur main, ou à la main (Actions > « Publier le site » > Run workflow).
# Prérequis (une seule fois) : Settings > Pages > Source = « GitHub Actions ».
# Chaîne : npm ci -> tests unitaires -> modèles d'IA vérifiés -> compilation (tsc + vite) -> déploiement.
# Les actions sont épinglées par empreinte de commit (le tag est noté en commentaire).
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitaires
        run: npm test
      # Les modèles d'IA (≈ 49 Mo) ne sont pas dans git : téléchargés à la construction (licences Apache-2.0), URLs et SHA-256 épinglés.
      - name: Télécharger et vérifier les modèles d'IA
        run: node scripts/fetch-models.mjs
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4
