[package]
name = "maxernzt"
version = "0.18.2"
description = "Atelier de collage : calques de papier découpé, animation par trajectoires"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
panic = "abort"
