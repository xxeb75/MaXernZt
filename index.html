  <label class="ctl" data-tip="Intensité de la texture" data-pos="top"><svg class="ic"><use href="#i-contrast"/></svg><input id="pt-amt" type="range" min="0" max="100" value="70"><output id="v-pt-amt"></output></label>
</div>
<div id="restore"><svg class="ic"><use href="#i-save"/></svg><span id="restore-txt"></span><button id="restore-yes" class="go">Restaurer</button><button id="restore-no" class="ib" data-tip="Ignorer et supprimer le brouillon" data-pos="bottom"><svg class="ic"><use href="#i-trash"/></svg></button></div>
<div id="help" role="dialog" aria-label="Aide">
  <div id="help-panel">
    <header id="help-head">
      <svg class="ic"><use href="#i-help"/></svg><b>Aide</b>
      <input id="help-q" type="search" placeholder="Rechercher une fonction…" autocomplete="off" spellcheck="false">
      <span class="sp"></span>
      <button id="help-tour" class="go">Visite guidée</button>
      <button id="help-close" class="ib" data-tip="Fermer (Échap)" data-pos="bottom-left"><svg class="ic"><use href="#i-x"/></svg></button>
    </header>
    <div id="help-main">
      <nav id="help-nav"></nav>
      <article id="help-body"></article>
    </div>
  </div>
</div>
<div id="tour" aria-live="polite">
  <div id="tour-hole"></div>
  <div id="tour-card" role="dialog" aria-label="Visite guidée">
    <div id="tour-step"></div>
    <h3 id="tour-title"></h3>
    <p id="tour-text"></p>
    <label id="tour-skip"><input id="tour-never" type="checkbox"> Ne plus afficher au démarrage</label>
    <div id="tour-nav">
      <button id="tour-close" class="ib" data-tip="Quitter la visite (Échap)" data-pos="top"><svg class="ic"><use href="#i-x"/></svg></button>
      <span class="sp"></span>
      <button id="tour-prev" class="ib" data-tip="Précédent" data-pos="top"><svg class="ic"><use href="#i-kprev"/></svg></button>
      <button id="tour-next" class="go">Suivant</button>
    </div>
  </div>
</div>
<div id="audpop">
  <div class="aud-title"><svg class="ic"><use href="#i-note"/></svg><div><b id="aud-name"></b><div id="aud-info"></div></div></div>
  <label class="ctl" data-tip="Volume" data-pos="top"><svg class="ic"><use href="#i-sound"/></svg><input id="aud-vol" type="range" min="0" max="100" value="90"><output id="v-aud-vol"></output></label>
  <label class="ctl" data-tip="Sensibilité de la détection : plus haut = plus de pics retenus" data-pos="top"><svg class="ic"><use href="#i-dance"/></svg><input id="aud-sens" type="range" min="0" max="100" value="50"><output id="v-aud-sens"></output></label>
  <div class="aud-btns">
    <button id="aud-mute" class="ib" data-tip="Couper le son (lecture et export)" data-pos="top"><svg class="ic"><use href="#i-sound"/></svg></button>
    <button id="aud-replace" class="ib" data-tip="Choisir une autre musique" data-pos="top"><svg class="ic"><use href="#i-import"/></svg></button>
    <span class="sp"></span>
    <button id="aud-remove" class="ib danger" data-tip="Retirer la musique du projet" data-pos="top"><svg class="ic"><use href="#i-trash"/></svg></button>
  </div>
</div>
<div id="dancepop">
  <div class="dp-title">Danse automatique</div>
  <div class="chips dp-row" data-tip="Quels repères de la musique déclenchent les effets" data-pos="top">
    <button class="chip txt on" data-bsrc="kicks" data-tip="Les coups de grosse caisse" data-pos="top">Grosse caisse</button>
    <button class="chip txt" data-bsrc="beats" data-tip="Une grille régulière au tempo détecté" data-pos="top">Temps</button>
    <button class="chip txt" data-bsrc="hits" data-tip="Toutes les attaques (graves et aigus)" data-pos="top">Attaques</button>
  </div>
  <div class="chips dp-row">
    <button class="chip txt on" data-dtarget="all" data-tip="Tous les éléments de la feuille" data-pos="top">Tout</button>
    <button class="chip txt" data-dtarget="sel" data-tip="Seulement la sélection (sinon tout)" data-pos="top">Sélection</button>
  </div>
  <div id="dance-fx" data-tip="Effets possibles : clique pour en retirer ou en remettre" data-pos="top"></div>
  <label class="ctl" data-tip="Intensité : part des éléments qui réagissent à chaque coup et part des coups utilisés" data-pos="top"><svg class="ic"><use href="#i-dance"/></svg><input id="dance-int" type="range" min="1" max="10" value="7"><output id="v-dance-int"></output></label>
  <label class="ctl" data-tip="Amplitude des mouvements (les coups forts bougent plus que les faibles)" data-pos="top"><svg class="ic"><use href="#i-fit"/></svg><input id="dance-amp" type="range" min="1" max="10" value="6"><output id="v-dance-amp"></output></label>
  <button id="dance-go" class="go"><svg class="ic"><use href="#i-dance"/></svg>Danser !</button>
</div>
<input id="file-audio" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.opus" hidden>
<div id="fxpop">
  <div id="fx-grid"></div>
  <label class="ctl" data-tip="Durée de l'effet" data-pos="top"><svg class="ic"><use href="#i-clock"/></svg><input id="fx-dur" type="range" min="0.3" max="3" step="0.1" value="1"><output id="v-fx-dur"></output></label>
</div>
<div id="bottom">
<section id="timeline">
  <div id="tl-grip" role="separator" aria-orientation="horizontal" data-tip="Étirer la timeline vers le haut (double-clic : replier)" data-pos="top"></div>
  <div class="tl-bar">
    <button id="btn-play" class="ib play" data-tip="Lecture / pause (Espace)" data-pos="top"><svg class="ic"><use href="#i-play"/></svg></button>
    <button id="btn-stop" class="ib" data-tip="Arrêter (Échap)" data-pos="top" disabled><svg class="ic"><use href="#i-stop"/></svg></button>
    <label class="ctl" data-tip="Instant de la tête de lecture" data-pos="top"><svg class="ic"><use href="#i-clock"/></svg><input id="tl-now" class="num" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" value="0.00 s"></label>
    <button id="btn-kprev" class="ib" data-tip="Image clé précédente (Alt+←)" data-pos="top"><svg class="ic"><use href="#i-kprev"/></svg></button>
    <button id="btn-knext" class="ib" data-tip="Image clé suivante (Alt+→)" data-pos="top"><svg class="ic"><use href="#i-knext"/></svg></button>
    <button id="btn-rec" class="ib rec" data-tip="Enregistrement automatique : en pause, déplace, tourne ou agrandis l'élément pour créer des images clés" data-pos="top"><svg class="ic"><use href="#i-rec"/></svg></button>
    <button id="btn-fx" class="ib fxbtn" data-tip="Effets prêts à l'emploi : posent des images clés à la tête de lecture" data-pos="top"><svg class="ic"><use href="#i-fx"/></svg></button>
    <button id="btn-audio" class="ib" data-tip="Musique : charger un fichier son (MP3, WAV…), forme d'onde et temps dans la timeline" data-pos="top"><svg class="ic"><use href="#i-note"/></svg></button>
    <button id="btn-dance" class="ib" data-tip="Danse automatique : des effets au hasard calés sur les temps de la musique" data-pos="top" disabled><svg class="ic"><use href="#i-dance"/></svg></button>
    <button id="btn-tlkey" class="ib keyadd" data-tip="Image clé de pose (position, rotation, taille) à cet instant" data-pos="top"><svg class="ic"><use href="#i-key"/></svg></button>
    <div id="kf-ed" data-prop="pos">
      <label class="ctl" data-tip="Instant de l'image clé" data-pos="top"><svg class="ic"><use href="#i-clock"/></svg><input id="kf-t" class="num" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" value="0 s"></label>
      <label class="ctl" data-tip="Valeur de l'image clé" data-pos="top"><svg class="ic"><use href="#i-key"/></svg><input id="kf-v" class="num" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" value="0"></label>
      <label class="ctl" id="kf-wl" data-tip="Valeur verticale (position)" data-pos="top"><input id="kf-w" class="num" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" value="0 px"></label>
      <button id="btn-kfease" class="ib" data-tip="Interpolation" data-pos="top"><svg class="ic"><use href="#i-ease-smooth"/></svg></button>
      <button id="btn-kfdel" class="ib danger" data-tip="Supprimer l'image clé (Suppr)" data-pos="top"><svg class="ic"><use href="#i-trash"/></svg></button>
    </div>
    <span class="sp"></span>
    <label class="ctl" data-tip="Durée de la timeline (0 = automatique)" data-pos="top"><svg class="ic"><use href="#i-film"/></svg><input id="tl-dur" class="num" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" value="5 s" style="width:11ch"></label>
    <label class="ctl" data-tip="Zoom de la timeline (Ctrl+molette)" data-pos="top"><svg class="ic"><use href="#i-fit"/></svg><input id="tl-zoom" type="range" min="20" max="400" value="90" style="width:90px"></label>
    <button id="btn-tlfold" class="ib" data-tip="Replier / déplier la timeline" data-pos="top"><svg class="ic"><use href="#i-chev"/></svg></button>
  </div>
  <div id="tl-body" class="tl-body">
    <div id="tl-stage">
      <div id="tl-ruler-row" class="tr rulerrow"><div class="tn"></div><div id="tl-ruler" class="tt"></div></div>
      <div id="tl-rows"></div>
      <div id="tl-head"></div>
      <div id="tl-empty">Sélectionne un élément ou un groupe pour afficher ses pistes.</div>
    </div>
  </div>
</section>
<div id="animbar" class="noanim nokey">
  <div class="arow">
    <div class="grp"><button id="btn-spinonly" class="ib keyadd" data-tip="Faire tourner sur place, sans trajectoire" data-pos="top"><svg class="ic"><use href="#i-spin"/></svg></button></div>
    <div class="grp path-ctl">
      <label class="ctl" data-tip="Durée de la trajectoire" data-pos="top"><svg class="ic"><use href="#i-clock"/></svg><input id="anim-dur" type="range" min="5" max="100" value="30"><input id="v-anim-dur" class="num" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" value="3.0 s" aria-label="valeur"></label>
      <button id="btn-amode" class="ib" data-tip="Boucle ou aller-retour" data-pos="top"><svg class="ic"><use href="#i-loop"/></svg></button>
      <button id="btn-aease" class="ib" data-tip="Vitesse constante ou douce" data-pos="top"><svg class="ic"><use href="#i-ease-linear"/></svg></button>
      <button id="btn-afollow" class="ib" data-tip="Tourner dans le sens du trajet" data-pos="top"><svg class="ic"><use href="#i-orient"/></svg></button>
      <label class="ctl" data-tip="Rotation continue : tours sur lui-même pendant un cycle (négatif = sens inverse)" data-pos="top"><svg class="ic"><use href="#i-spin"/></svg><input id="v-turns" class="num" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" value="0 tr" aria-label="Tours par cycle"></label>
      <button id="btn-adel" class="ib danger" data-tip="Supprimer la trajectoire" data-pos="top"><svg class="ic"><use href="#i-trash"/></svg></button>
    </div>
    <div class="grp key-ctl">
      <button id="btn-key" class="ib keyadd" data-tip="Ajouter une image clé à cet instant" data-pos="top"><svg class="ic"><use href="#i-key"/></svg></button>
      <div class="key-only">
        <label class="ctl" data-tip="Durée de la pause" data-pos="top"><svg class="ic"><use href="#i-hold"/></svg><input id="key-hold" type="range" min="1" max="50" value="8"><input id="v-key-hold" class="num" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" value="0.8 s" aria-label="valeur"></label>
        <label class="ctl" data-tip="Rotation pendant la pause (ou poignée ronde)" data-pos="top"><svg class="ic"><use href="#i-spin"/></svg><input id="key-spin" type="range" min="-720" max="720" step="15" value="0"><input id="v-key-spin" class="num" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" value="0°" aria-label="valeur"></label>
        <button id="btn-kball" class="ib" data-tip="Se chiffonner en boule" data-pos="top"><svg class="ic"><use href="#i-ball"/></svg></button>
        <button id="btn-kdel" class="ib danger" data-tip="Supprimer l'image clé" data-pos="top"><svg class="ic"><use href="#i-trash"/></svg></button>
      </div>
    </div>
  </div>
</div>

</div>

<div id="toasts" aria-live="polite"></div>

<footer id="foot"><span id="status"></span><span id="autosv"></span></footer>

<input id="file-bank" type="file" accept="image/*" multiple hidden>
<input id="file" type="file" accept="image/*" multiple hidden>
<input id="file-proj" type="file" accept=".maxernzt,application/json" hidden>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
