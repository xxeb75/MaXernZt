<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaXernZt</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<aside id="tools">
  <h1>MaXernZt</h1>
  <section>
    <h2>Image</h2>
    <button id="btn-import">Importer…</button>
    <button id="btn-ai">Détourer (IA)</button>
    <button id="btn-sam">🎯 Détourer au clic (SAM)</button>
    <button id="btn-flat">Détourer fond uni</button>
    <label class="row">Tolérance <input id="tol" type="range" min="5" max="120" value="40"></label>
  </section>
  <section>
    <h2>Découpe</h2>
    <button id="btn-scissors">✂ Ciseaux (tracer)</button>
    <button id="btn-tear">〰 Déchirer (tracer)</button>
  </section>
  <section>
    <h2>Calque</h2>
    <label class="row">Bord blanc <input id="border" type="range" min="0" max="20" value="6"></label>
    <label class="row">Ombre <input id="shadow" type="range" min="0" max="100" value="40"></label>
    <div class="grid">
      <button id="btn-dup">Dupliquer</button>
      <button id="btn-flip">Miroir</button>
      <button id="btn-up">Avancer</button>
      <button id="btn-down">Reculer</button>
      <button id="btn-del" class="danger">Supprimer</button>
    </div>
  </section>
  <section>
    <h2>Lettres</h2>
    <input id="word" type="text" placeholder="Un mot…" maxlength="24">
    <button id="btn-word">Composer le mot</button>
  </section>
  <section>
    <h2>Toile</h2>
    <label class="row">Fond <input id="bg" type="color" value="#cfe8e6"></label>
    <button id="btn-export">Exporter PNG</button>
    <button id="btn-export-layers">Exporter les calques</button>
  </section>
  <p id="status">Glisse des images ici, ou colle-les (Ctrl+V).</p>
  <p class="help">Clic : sélectionner/déplacer · Alt+molette : taille · Maj+molette : rotation · Ctrl+molette ou clic milieu : zoom/déplacement de la vue · Suppr : effacer</p>
</aside>
<main id="stage"></main>
<input id="file" type="file" accept="image/*" multiple hidden>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
