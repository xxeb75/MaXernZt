<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaXernZt</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>

<!-- Jeu d'icônes : grille 24 px, trait 1,75, extrémités rondes -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 3.5h16V10l-3 1.6-3-1.6-3 1.6-3-1.6-4 1.6z"/><path d="M4 14.4l4 1.6 3-1.6 3 1.6 3-1.6 3 1.6v5.1H4z" fill="currentColor" fill-opacity=".25"/></symbol>
  <symbol id="i-select" viewBox="0 0 24 24"><path d="M6 3.5v15.2l4-3.6 2.7 5.7 2.6-1.2-2.6-5.6 5.3-.3z"/></symbol>
  <symbol id="i-import" viewBox="0 0 24 24"><rect x="2.8" y="3" width="15.4" height="13.4" rx="2"/><circle cx="7.6" cy="7.6" r="1.4"/><path d="M2.8 13.4l4.8-4 4 3 2.6-2.2 4 3.4"/><path d="M19.6 15.8v6.4M16.4 19h6.4"/></symbol>
  <symbol id="i-auto" viewBox="0 0 24 24"><path d="M4.5 19.5l9.5-9.5"/><path d="M12.4 8.4l3.2 3.2" stroke-width="3.4"/><path d="M17 3.5v3.4M15.3 5.2h3.4"/><path d="M19.8 10.5v2.6M18.5 11.8h2.6"/><path d="M8 4.5v2.2M6.9 5.6h2.2"/></symbol>
  <symbol id="i-pick" viewBox="0 0 24 24"><path d="M10.5 3.6a6.9 6.9 0 1 0 6.9 6.9" stroke-dasharray="2.4 2.6"/><path d="M12 11.5v9.5l2.7-2.5 2 4 2.1-1-2-4 3.6-.3z" fill="currentColor"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M13.6 3.9l6.5 6.5a1.4 1.4 0 0 1 0 2L12.2 20.3H8l-4-4a1.4 1.4 0 0 1 0-2l8.3-8.4a1.4 1.4 0 0 1 1.3-.4z"/><path d="M8.6 9.3l7.3 7.3"/><path d="M10.5 20.3H21"/></symbol>
  <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="5.8" cy="6" r="2.7"/><circle cx="5.8" cy="18" r="2.7"/><path d="M8 7.6L21 18M8 16.4L21 6"/></symbol>
  <symbol id="i-tear" viewBox="0 0 24 24"><path d="M3.8 3.5h7.6l-2.3 4.3 3 3.6-3 3.6 2.3 5.5H3.8z"/><g transform="translate(1.4 1.2) rotate(8 17 12)"><path d="M13.6 3.5l2.3 4.3-3 3.6 3 3.6-2.3 5.5h6.6v-17z"/></g></symbol>
  <symbol id="i-letter" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.6" transform="rotate(-7 12 12)"/><path d="M8.3 16.6L12 7.6l3.7 9M9.6 13.7h4.8" transform="rotate(-7 12 12)"/></symbol>
  <symbol id="i-border" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><rect x="8.2" y="8.2" width="7.6" height="7.6" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-shadow" viewBox="0 0 24 24"><rect x="3.8" y="3.8" width="11.5" height="11.5" rx="1.6"/><path d="M18.8 8.6v8.9a1.6 1.6 0 0 1-1.6 1.6H8.6" opacity=".55"/></symbol>
  <symbol id="i-tol" viewBox="0 0 24 24"><path d="M4 8h9M18 8h2M4 16h2M11 16h9"/><circle cx="15.5" cy="8" r="2.3"/><circle cx="8.5" cy="16" r="2.3"/></symbol>
  <symbol id="i-flip" viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 2.3"/><path d="M9 7L3.6 17H9z"/><path d="M15 7l5.4 10H15z" fill="currentColor" fill-opacity=".35"/></symbol>
  <symbol id="i-dup" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="1.8"/><path d="M15.5 8.5V6A1.8 1.8 0 0 0 13.7 4.2H6A1.8 1.8 0 0 0 4.2 6v7.7A1.8 1.8 0 0 0 6 15.5h2.5"/></symbol>
  <symbol id="i-front" viewBox="0 0 24 24"><path d="M12 20.5V6.5M6.2 11.8L12 6l5.8 5.8"/><path d="M6 3.5h12"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M12 3.5v14M6.2 12.2L12 18l5.8-5.8"/><path d="M6 20.5h12"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.2 7V4.4h5.6V7M6.4 7l1 13.1h9.2l1-13.1M10 11v5.5M14 11v5.5"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 4.5L4 9.5l5 5"/><path d="M4.5 9.5h10a5.2 5.2 0 0 1 0 10.5H10"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 4.5l5 5-5 5"/><path d="M19.5 9.5h-10a5.2 5.2 0 0 0 0 10.5H14"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5.2 3.5h11.1l4.2 4.2v11.5a1.5 1.5 0 0 1-1.5 1.5H5.2a1.5 1.5 0 0 1-1.5-1.5V5A1.5 1.5 0 0 1 5.2 3.5z"/><path d="M7.5 3.5v5h8v-5M7.5 20.7v-6.7h9v6.7"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 6.8A1.6 1.6 0 0 1 4.6 5.2h4.3l2.1 2.6h8.4a1.6 1.6 0 0 1 1.6 1.6v8.8a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 18.2z"/></symbol>
  <symbol id="i-new" viewBox="0 0 24 24"><path d="M6 3.5h8l5 5v10.8a1.5 1.5 0 0 1-1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5V5A1.5 1.5 0 0 1 6 3.5z"/><path d="M14 3.5v5h5M12 12.5v5.5M9.2 15.2h5.6"/></symbol>
  <symbol id="i-png" viewBox="0 0 24 24"><rect x="2.8" y="3" width="15.4" height="13.4" rx="2"/><circle cx="7.6" cy="7.6" r="1.4"/><path d="M2.8 13.4l4.8-4 4 3 2.6-2.2 4 3.4"/><path d="M19.6 15.4v6.2M17.2 19.2l2.4 2.4 2.4-2.4"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3.5l8.5 4.5-8.5 4.5L3.5 8z"/><path d="M3.5 12l8.5 4.5 8.5-4.5"/><path d="M3.5 16l8.5 4.5 8.5-4.5"/></symbol>
  <symbol id="i-layers-out" viewBox="0 0 24 24"><path d="M12 2.8l8 4.2-8 4.2L4 7z"/><path d="M4 11.2l8 4.2 8-4.2"/><path d="M12 17v4.6M10 19.8l2 2 2-2"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.4S5.6 10 5.6 14.6a6.4 6.4 0 0 0 12.8 0C18.4 10 12 3.4 12 3.4z"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4.5h4.5M15.5 4.5H20V9M20 15v4.5h-4.5M8.5 19.5H4V15"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
</svg>

<header id="top">
  <span class="logo" data-tip="MaXernZt" data-pos="bottom"><svg class="ic"><use href="#i-logo"/></svg></span>
  <div class="grp">
    <button id="btn-new" class="ib" data-tip="Nouvelle feuille" data-pos="bottom"><svg class="ic"><use href="#i-new"/></svg></button>
    <button id="btn-open" class="ib" data-tip="Ouvrir un projet (Ctrl+O)" data-pos="bottom"><svg class="ic"><use href="#i-open"/></svg></button>
    <button id="btn-save" class="ib" data-tip="Enregistrer (Ctrl+S)" data-pos="bottom"><svg class="ic"><use href="#i-save"/></svg></button>
  </div>
  <div class="grp">
    <button id="btn-undo" class="ib" data-tip="Annuler (Ctrl+Z)" data-pos="bottom"><svg class="ic"><use href="#i-undo"/></svg></button>
    <button id="btn-redo" class="ib" data-tip="Rétablir (Ctrl+Y)" data-pos="bottom"><svg class="ic"><use href="#i-redo"/></svg></button>
  </div>
  <span class="sp"></span>
  <div class="grp">
    <button id="btn-export" class="ib" data-tip="Exporter l'image PNG" data-pos="bottom-left"><svg class="ic"><use href="#i-png"/></svg></button>
    <button id="btn-export-layers" class="ib" data-tip="Exporter les calques (PNG + manifeste)" data-pos="bottom-left"><svg class="ic"><use href="#i-layers-out"/></svg></button>
  </div>
</header>

<div id="opts" class="nosel">
  <div class="grp needs-sel">
    <label class="ctl" data-tip="Contour blanc" data-pos="bottom"><svg class="ic"><use href="#i-border"/></svg><input id="border" type="range" min="0" max="20" value="6"><output id="v-border"></output></label>
    <label class="ctl" data-tip="Ombre" data-pos="bottom"><svg class="ic"><use href="#i-shadow"/></svg><input id="shadow" type="range" min="0" max="100" value="40"><output id="v-shadow"></output></label>
  </div>
  <div class="grp needs-sel">
    <button id="btn-flip" class="ib" data-tip="Miroir" data-pos="bottom"><svg class="ic"><use href="#i-flip"/></svg></button>
    <button id="btn-dup" class="ib" data-tip="Dupliquer (Ctrl+D)" data-pos="bottom"><svg class="ic"><use href="#i-dup"/></svg></button>
    <button id="btn-up" class="ib" data-tip="Avancer ( ] )" data-pos="bottom"><svg class="ic"><use href="#i-front"/></svg></button>
    <button id="btn-down" class="ib" data-tip="Reculer ( [ )" data-pos="bottom"><svg class="ic"><use href="#i-back"/></svg></button>
    <button id="btn-del" class="ib danger" data-tip="Supprimer (Suppr)" data-pos="bottom"><svg class="ic"><use href="#i-trash"/></svg></button>
  </div>
  <div class="grp">
    <label class="ctl" data-tip="Tolérance du fond uni" data-pos="bottom"><svg class="ic"><use href="#i-tol"/></svg><input id="tol" type="range" min="5" max="120" value="40"><output id="v-tol"></output></label>
  </div>
  <span class="sp"></span>
  <div class="grp">
    <label class="ctl swatch" data-tip="Couleur de la feuille" data-pos="bottom-left"><svg class="ic"><use href="#i-drop"/></svg><input id="bg" type="color" value="#cfe8e6"></label>
    <button id="btn-fit" class="ib" data-tip="Tout voir (0)" data-pos="bottom-left"><svg class="ic"><use href="#i-fit"/></svg></button>
    <output id="zoom">100%</output>
  </div>
</div>

<aside id="tools">
  <button id="btn-select" class="tb on" data-tip="Déplacer (V)" data-pos="right"><svg class="ic"><use href="#i-select"/></svg></button>
  <button id="btn-import" class="tb" data-tip="Importer des images" data-pos="right"><svg class="ic"><use href="#i-import"/></svg></button>
  <hr>
  <button id="btn-ai" class="tb" data-tip="Détourer automatiquement (A)" data-pos="right"><svg class="ic"><use href="#i-auto"/></svg></button>
  <button id="btn-sam" class="tb" data-tip="Détourer au clic (C)" data-pos="right"><svg class="ic"><use href="#i-pick"/></svg></button>
  <button id="btn-flat" class="tb" data-tip="Effacer le fond uni (B)" data-pos="right"><svg class="ic"><use href="#i-eraser"/></svg></button>
  <hr>
  <button id="btn-scissors" class="tb" data-tip="Ciseaux (X)" data-pos="right"><svg class="ic"><use href="#i-scissors"/></svg></button>
  <button id="btn-tear" class="tb" data-tip="Déchirer (R)" data-pos="right"><svg class="ic"><use href="#i-tear"/></svg></button>
  <hr>
  <button id="btn-text" class="tb" data-tip="Lettres découpées (T)" data-pos="right"><svg class="ic"><use href="#i-letter"/></svg></button>
  <div id="textpop">
    <input id="word" type="text" maxlength="24" placeholder="Aa…" autocomplete="off" spellcheck="false">
    <button id="btn-word" class="ib" data-tip="Composer" data-pos="bottom"><svg class="ic"><use href="#i-check"/></svg></button>
  </div>
</aside>

<main id="stage">
  <button id="empty" aria-label="Importer des images"><svg class="ic"><use href="#i-import"/></svg></button>
</main>

<aside id="layers">
  <header><svg class="ic"><use href="#i-layers"/></svg><output id="lcount">0</output></header>
  <ul id="layer-list"></ul>
</aside>

<footer id="foot"><span id="status"></span></footer>

<input id="file" type="file" accept="image/*" multiple hidden>
<input id="file-proj" type="file" accept=".maxernzt,application/json" hidden>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
