<header id="top">
  <span class="logo" data-tip="MaXernZt" data-pos="bottom"><svg class="ic"><use href="#i-logo"/></svg></span>
  <div class="grp">
    <button id="btn-new" class="ib" data-tip="Nouvelle feuille" data-pos="bottom"><svg class="ic"><use href="#i-new"/></svg></button>
    <button id="btn-open" class="ib" data-tip="Ouvrir un projet (Ctrl+O)" data-pos="bottom"><svg class="ic"><use href="#i-open"/></svg></button>
    <button id="btn-save" class="ib" data-tip="Enregistrer (Ctrl+S)" data-pos="bottom"><svg class="ic"><use href="#i-save"/></svg></button>
  </div>
  <div class="grp">
    <button id="btn-undo" class="ib" data-tip="Annuler (Ctrl+Z)" data-pos="bottom"><svg class="ic"><use href="#i-undo"/></svg></button>
    <button id="btn-redo" class="ib" data-tip="Rétablir (Ctrl+Y)" data-pos="bottom"><svg class="ic"><use href="#i-redo"/></svg></button>
  </div>
  <span class="sp"></span>
  <div class="grp">
    <button id="btn-export" class="ib" data-tip="Exporter l'image PNG" data-pos="bottom-left"><svg class="ic"><use href="#i-png"/></svg></button>
    <button id="btn-export-layers" class="ib" data-tip="Exporter les calques (PNG + manifeste)" data-pos="bottom-left"><svg class="ic"><use href="#i-layers-out"/></svg></button>
  </div>
</header>

<div id="opts" class="nosel">
  <div class="grp needs-sel">
    <label class="ctl" data-tip="Contour blanc" data-pos="bottom"><svg class="ic"><use href="#i-border"/></svg><input id="border" type="range" min="0" max="20" value="6"><output id="v-border"></output></label>
    <label class="ctl" data-tip="Contour irrégulier" data-pos="bottom"><svg class="ic"><use href="#i-tear"/></svg><input id="rough" type="range" min="0" max="100" value="60"><output id="v-rough"></output></label>
    <label class="ctl" data-tip="Ombre" data-pos="bottom"><svg class="ic"><use href="#i-shadow"/></svg><input id="shadow" type="range" min="0" max="100" value="40"><output id="v-shadow"></output></label>
  </div>
  <div class="grp needs-sel">
    <button id="btn-group" class="ib" data-tip="Grouper (Ctrl+G)" data-pos="bottom"><svg class="ic"><use href="#i-grp"/></svg></button>
    <button id="btn-ungroup" class="ib" data-tip="Dissocier (Ctrl+Maj+G)" data-pos="bottom"><svg class="ic"><use href="#i-ungrp"/></svg></button>
    <button id="btn-flip" class="ib" data-tip="Miroir" data-pos="bottom"><svg class="ic"><use href="#i-flip"/></svg></button>
    <button id="btn-dup" class="ib" data-tip="Dupliquer (Ctrl+D)" data-pos="bottom"><svg class="ic"><use href="#i-dup"/></svg></button>
    <button id="btn-up" class="ib" data-tip="Avancer ( ] )" data-pos="bottom"><svg class="ic"><use href="#i-front"/></svg></button>
    <button id="btn-down" class="ib" data-tip="Reculer ( [ )" data-pos="bottom"><svg class="ic"><use href="#i-back"/></svg></button>
    <button id="btn-del" class="ib danger" data-tip="Supprimer (Suppr)" data-pos="bottom"><svg class="ic"><use href="#i-trash"/></svg></button>
  </div>
  <div class="grp">
    <button id="btn-scrap" class="ib" data-tip="Ciseaux : jeter la chute (la plus petite part)" data-pos="bottom"><svg class="ic"><use href="#i-scrap"/></svg></button>
    <label class="ctl" data-tip="Tolérance du fond uni" data-pos="bottom"><svg class="ic"><use href="#i-tol"/></svg><input id="tol" type="range" min="5" max="120" value="40"><output id="v-tol"></output></label>
  </div>
  <span class="sp"></span>
  <div class="grp">
    <button id="fmt-169" class="ib" data-tip="Format 16/9 (1920×1080)" data-pos="bottom-left"><svg class="ic"><use href="#i-fmt-169"/></svg></button>
    <button id="fmt-11" class="ib" data-tip="Format carré (1080×1080)" data-pos="bottom-left"><svg class="ic"><use href="#i-fmt-11"/></svg></button>
    <button id="fmt-916" class="ib" data-tip="Format 9/16 (1080×1920)" data-pos="bottom-left"><svg class="ic"><use href="#i-fmt-916"/></svg></button>
  </div>
  <div class="grp">
    <label class="ctl swatch" data-tip="Couleur de la feuille" data-pos="bottom-left"><svg class="ic"><use href="#i-drop"/></svg><input id="bg" type="color" value="#cfe8e6"></label>
    <button id="btn-fit" class="ib" data-tip="Tout voir (0)" data-pos="bottom-left"><svg class="ic"><use href="#i-fit"/></svg></button>
    <output id="zoom">100%</output>
  </div>
</div>

<aside id="tools">
  <button id="btn-select" class="tb on" data-tip="Déplacer (V)" data-pos="right"><svg class="ic"><use href="#i-select"/></svg></button>
  <button id="btn-import" class="tb" data-tip="Importer des images" data-pos="right"><svg class="ic"><use href="#i-import"/></svg></button>
  <hr>
  <button id="btn-ai" class="tb" data-tip="Détourer automatiquement (A)" data-pos="right"><svg class="ic"><use href="#i-auto"/></svg></button>
  <button id="btn-sam" class="tb" data-tip="Détourer au clic (C)" data-pos="right"><svg class="ic"><use href="#i-pick"/></svg></button>
  <button id="btn-flat" class="tb" data-tip="Effacer le fond uni (B)" data-pos="right"><svg class="ic"><use href="#i-eraser"/></svg></button>
  <hr>
  <button id="btn-scissors" class="tb" data-tip="Ciseaux (X)" data-pos="right"><svg class="ic"><use href="#i-scissors"/></svg></button>
  <button id="btn-tear" class="tb" data-tip="Déchirer (R)" data-pos="right"><svg class="ic"><use href="#i-tear"/></svg></button>
  <hr>
  <button id="btn-path" class="tb" data-tip="Trajectoire (P)" data-pos="right"><svg class="ic"><use href="#i-path"/></svg></button>
  <hr>
  <button id="btn-acc" class="tb" data-tip="Accessoires : scotch, peinture, punaises (E)" data-pos="right"><svg class="ic"><use href="#i-acc"/></svg></button>
  <button id="btn-text" class="tb" data-tip="Lettres découpées (T)" data-pos="right"><svg class="ic"><use href="#i-letter"/></svg></button>
  <div id="accpop" data-cat="tape">
    <div class="seg" id="acc-cats">
      <button class="ib on" data-cat="tape" data-tip="Scotch et rubans" data-pos="top"><svg class="ic"><use href="#i-tape"/></svg></button>
      <button class="ib" data-cat="paint" data-tip="Peinture" data-pos="top"><svg class="ic"><use href="#i-brush"/></svg></button>
      <button class="ib" data-cat="pin" data-tip="Punaises" data-pos="top"><svg class="ic"><use href="#i-pin"/></svg></button>
      <button class="ib" data-cat="metal" data-tip="Trombones et agrafes" data-pos="top"><svg class="ic"><use href="#i-clip"/></svg></button>
    </div>
    <div id="acc-grid"></div>
    <div class="chips" id="acc-colors">
      <label class="swatch chip" id="acc-custom" data-tip="Autre couleur" data-pos="top"><input id="acc-custom-in" type="color" value="#c1272d"></label>
    </div>
    <label class="ctl" id="acc-len-row" data-tip="Longueur du ruban" data-pos="top"><svg class="ic"><use href="#i-ruler"/></svg><input id="acc-len" type="range" min="0" max="100" value="38"><output id="v-acc-len"></output></label>
    <label class="ctl" id="acc-size-row" data-tip="Taille" data-pos="top"><svg class="ic"><use href="#i-fit"/></svg><input id="acc-size" type="range" min="30" max="250" value="100"><output id="v-acc-size"></output></label>
    <div class="tp-row">
      <label class="ctl grow" data-tip="État : neuf → abîmé (jaunissement, taches, plis, fissures, rouille selon la matière)" data-pos="top"><svg class="ic"><use href="#i-stain"/></svg><input id="acc-wear" type="range" min="0" max="100" value="15"><output id="v-acc-wear"></output></label>
      <button id="acc-dice" class="ib" data-tip="Autre tirage" data-pos="top"><svg class="ic"><use href="#i-dice"/></svg></button>
    </div>
  </div>
  <div id="textpop">
    <div class="tp-row">
      <input id="word" type="text" maxlength="24" placeholder="Aa…" autocomplete="off" spellcheck="false">
      <button id="btn-word" class="ib ok" data-tip="Ajouter à la feuille" data-pos="bottom"><svg class="ic"><use href="#i-check"/></svg></button>
    </div>
    <div class="tp-prev"><canvas id="tp-preview" width="560" height="150"></canvas><button id="tp-dice" class="ib" data-tip="Autre tirage" data-pos="top"><svg class="ic"><use href="#i-dice"/></svg></button></div>
    <div class="seg" id="tp-mode">
      <button data-mode="grouped" class="ib" data-tip="Lettres sur un même papier" data-pos="top"><svg class="ic"><use href="#i-group"/></svg></button>
      <button data-mode="separate" class="ib" data-tip="Une lettre par papier" data-pos="top"><svg class="ic"><use href="#i-separate"/></svg></button>
    </div>
    <div class="chips" id="tp-fonts"></div>
    <div class="chips" id="tp-colors"></div>
    <div class="tp-custom" id="tp-custom">
      <label class="swatch ctl" data-tip="Couleur du papier" data-pos="top"><svg class="ic"><use href="#i-drop"/></svg><input id="tp-paper" type="color" value="#e7a29a"></label>
      <label class="swatch ctl" data-tip="Couleur de l'encre" data-pos="top"><svg class="ic"><use href="#i-letter"/></svg><input id="tp-ink" type="color" value="#1d1d1d"></label>
    </div>
    <label class="ctl" data-tip="Bords : coupés → déchirés" data-pos="top"><svg class="ic"><use href="#i-tear"/></svg><input id="tp-tear" type="range" min="0" max="100" value="35"><output id="v-tp-tear"></output></label>
    <label class="ctl" data-tip="État : neuf → crade" data-pos="top"><svg class="ic"><use href="#i-stain"/></svg><input id="tp-dirt" type="range" min="0" max="100" value="20"><output id="v-tp-dirt"></output></label>
  </div>
  </aside>

<main id="stage">
  <button id="empty" aria-label="Importer des images"><svg class="ic"><use href="#i-import"/></svg></button>
</main>

<aside id="layers">
  <header><svg class="ic"><use href="#i-layers"/></svg><output id="lcount">0</output></header>
  <ul id="layer-list"></ul>
</aside>

<div id="animbar" class="noanim nokey">
  <div class="arow">
    <button id="btn-play" class="ib play" data-tip="Lecture / pause (Espace)" data-pos="top"><svg class="ic"><use href="#i-play"/></svg></button>
    <button id="btn-stop" class="ib" data-tip="Arrêter (Échap)" data-pos="top" disabled><svg class="ic"><use href="#i-stop"/></svg></button>
    <div class="tlwrap"><input id="tl" type="range" min="0" max="1000" value="0"><div id="tl-keys"></div></div>
    <output id="v-tl">0.0 / 3.0 s</output>
  </div>
  <div class="arow">
    <div class="grp path-ctl">
      <label class="ctl" data-tip="Durée de la trajectoire" data-pos="top"><svg class="ic"><use href="#i-clock"/></svg><input id="anim-dur" type="range" min="5" max="100" value="30"><input id="v-anim-dur" class="num" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" value="3.0 s" aria-label="valeur"></label>
      <button id="btn-amode" class="ib" data-tip="Boucle ou aller-retour" data-pos="top"><svg class="ic"><use href="#i-loop"/></svg></button>
      <button id="btn-aease" class="ib" data-tip="Vitesse constante ou douce" data-pos="top"><svg class="ic"><use href="#i-ease-linear"/></svg></button>
      <button id="btn-afollow" class="ib" data-tip="Tourner dans le sens du trajet" data-pos="top"><svg class="ic"><use href="#i-orient"/></svg></button>
      <button id="btn-adel" class="ib danger" data-tip="Supprimer la trajectoire" data-pos="top"><svg class="ic"><use href="#i-trash"/></svg></button>
    </div>
    <div class="grp key-ctl">
      <button id="btn-key" class="ib keyadd" data-tip="Ajouter une image clé à cet instant" data-pos="top"><svg class="ic"><use href="#i-key"/></svg></button>
      <div class="key-only">
        <label class="ctl" data-tip="Durée de la pause" data-pos="top"><svg class="ic"><use href="#i-hold"/></svg><input id="key-hold" type="range" min="1" max="50" value="8"><input id="v-key-hold" class="num" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" value="0.8 s" aria-label="valeur"></label>
        <label class="ctl" data-tip="Rotation pendant la pause (ou poignée ronde)" data-pos="top"><svg class="ic"><use href="#i-spin"/></svg><input id="key-spin" type="range" min="-720" max="720" step="15" value="0"><input id="v-key-spin" class="num" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" value="0°" aria-label="valeur"></label>
        <button id="btn-kball" class="ib" data-tip="Se chiffonner en boule" data-pos="top"><svg class="ic"><use href="#i-ball"/></svg></button>
        <button id="btn-kdel" class="ib danger" data-tip="Supprimer l'image clé" data-pos="top"><svg class="ic"><use href="#i-trash"/></svg></button>
      </div>
    </div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<footer id="foot"><span id="status"></span></footer>

<input id="file" type="file" accept="image/*" multiple hidden>
<input id="file-proj" type="file" accept=".maxernzt,application/json" hidden>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
